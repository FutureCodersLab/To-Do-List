<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>To-Do List</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
        />
        <link rel="stylesheet" href="styles.css" />
        <script type="module" src="script.js" defer></script>
    </head>
    <body>
        <div id="container">
            <header>
                <div class="main-header">
                    <h1>To-Do List</h1>
                    <span id="task-summary">0 / 0</span>
                </div>
                <div id="progress-bar">
                    <div id="progress"></div>
                </div>
            </header>

            <form action="">
                <div id="input-container">
                    <input type="text" placeholder="Write Your Task" />
                    <span id="microphone" class="material-symbols-rounded"
                        >mic</span
                    >
                </div>
                <button id="submit-task" type="submit">
                    <span class="material-symbols-rounded input-icon">add</span>
                </button>
            </form>

            <ul id="task-list">
                <li class="task">
                    <div class="checkbox-group">
                        <input
                            type="checkbox"
                            class="checkbox"
                            id="checkbox-0"
                        />
                        <label for="checkbox-0">do homework</label>
                    </div>
                    <div class="actions">
                        <button class="edit">
                            <span class="material-symbols-rounded task-icon"
                                >edit_square</span
                            >
                        </button>
                        <button class="delete">
                            <span class="material-symbols-rounded task-icon"
                                >delete</span
                            >
                        </button>
                    </div>
                </li>
            </ul>
        </div>
    </body>
</html>
